[package]
name = "rtiow"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { version = "0.38.0", features = ["linked"] }
ash-window = "0.13.0"
bytemuck = "1.25.0"
glam = "0.32.1"
gpu-allocator = "0.28.0"
thiserror = "2.0.18"
winit = "0.30.12"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[profile.dev]
incremental = true

[profile.release]
strip = true
opt-level = 3
lto = true
